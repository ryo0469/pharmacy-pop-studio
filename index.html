<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>薬局POPスタジオ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=M+PLUS+Rounded+1c:wght@500;800;900&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style id="pageSize"></style>
<style>
/* 画面UI: 左=つくるもの・用紙・デザイン / 中央=プレビュー / 右=文面。ポスター自体の色は店舗設定から生成 */
:root{
  --bg:#edf1ef; --panel:#ffffff; --ink:#1c2422; --muted:#5d6966; --line:#d7dfdb;
  --ua:#2f8f5b; --ua-deep:#1d5c3a; --ua-soft:#e8f3ed;
  --ui-font:'Noto Sans JP','Hiragino Sans','Yu Gothic UI','Meiryo',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui-font);font-size:14px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ua);outline-offset:2px}

#app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:.04em}
.brand svg{width:22px;height:22px}
.shop-chip{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 14px 5px 6px;cursor:pointer;min-width:0}
.shop-chip:hover{border-color:var(--ua)}
.shop-chip i{width:24px;height:24px;border-radius:50%;background:var(--ua);flex:none}
.shop-chip span{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.shop-chip small{color:var(--muted);font-size:12px}
.top-actions{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 16px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ua);color:var(--ua-deep)}
.btn.primary{background:var(--ua-deep);border-color:var(--ua-deep);color:#fff}
.btn.primary:hover{filter:brightness(1.1);color:#fff}
.btn.ghost{background:transparent}
.btn.small{padding:5px 10px;font-size:13px}

.banner{background:#fff6dc;border-bottom:1px solid #ecd9a0;padding:8px 16px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner button{border:0;background:none;color:#7a5a00;text-decoration:underline;cursor:pointer;padding:0}

.work{flex:1;min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr) 350px}
.side{background:var(--panel);overflow-y:auto;padding:4px 16px 24px}
.side.left{border-right:1px solid var(--line)}
.side.right{border-left:1px solid var(--line)}
.side section{padding-block:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.side section:last-child{border-bottom:0}
.side h2{margin:0;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}

.seg{display:flex;background:var(--bg);border-radius:8px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:6px;padding:6px 4px;cursor:pointer;font-size:13px;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--panel);font-weight:700;color:var(--ua-deep);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.tpl-list{display:flex;flex-direction:column;gap:4px}
.tpl-list button{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 10px;cursor:pointer}
.tpl-list button:hover{background:var(--bg)}
.tpl-list button[aria-pressed="true"]{border-color:var(--ua);background:var(--ua-soft)}
.tpl-list b{font-size:13.5px}
.tpl-list small{color:var(--muted);font-size:12px}

.size-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.size-grid button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.size-grid button b{font-size:13px}
.size-grid button small{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.size-grid button[aria-pressed="true"]{border-color:var(--ua);background:var(--ua-soft);color:var(--ua-deep)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.check input{margin-top:4px}
.check[aria-disabled="true"]{opacity:.45;cursor:default}

.mood-list{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mood-list button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.mood-list button[aria-pressed="true"]{border-color:var(--ua);background:var(--ua-soft)}
.mood-list .aa{font-size:18px;line-height:1.2}
.mood-list small{font-size:11.5px;color:var(--muted);line-height:1.3}
.mood-list .auto{grid-column:1/-1}

.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:
  radial-gradient(circle, rgba(0,0,0,.06) 1px, transparent 1.2px) 0 0/18px 18px, var(--bg)}
.stage-inner{flex:1;min-height:0;display:grid;place-items:center;padding:24px;overflow:hidden}
#sheetWrap{position:relative;box-shadow:0 2px 6px rgba(0,0,0,.08),0 16px 40px rgba(20,40,30,.16)}
#sheetWrap > .sheet{position:absolute;left:0;top:0;transform-origin:0 0}
.stage-meta{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding:0 16px 12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.stage-meta .warn{color:#a13d1f;font-weight:700}

.field{display:flex;flex-direction:column;gap:4px}
.field label,.field .lbl{font-size:12.5px;font-weight:700}
.field .hint{font-size:11.5px;color:var(--muted)}
.field input[type=text],.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fbfcfb}
.field textarea{resize:vertical;line-height:1.55}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--ua);outline:none;background:#fff}
.fields{display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.img-field{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.img-field img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.img-field input[type=file]{font-size:12px;max-width:100%}
details.more{border:1px dashed var(--line);border-radius:8px;padding:8px 10px}
details.more summary{cursor:pointer;font-size:13px;color:var(--muted)}
details.more .fields{margin-top:10px}
.law{font-size:11.5px;color:#7a5a00;background:#fff6dc;border-radius:6px;padding:6px 8px;line-height:1.5}

/* ---------- モーダル（店舗設定） ---------- */
.modal{position:fixed;inset:0;background:rgba(18,28,24,.55);display:grid;place-items:center;padding:16px;z-index:50}
.modal-card{background:var(--panel);border-radius:14px;width:min(1120px,100%);height:min(900px,calc(100vh - 32px));display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.wiz-form{overflow-y:auto;padding:28px 32px;display:flex;flex-direction:column;gap:22px}
.wiz-form h1{margin:0;font-size:22px}
.wiz-form .lead{margin:4px 0 0;color:var(--muted)}
.wiz-step{display:flex;flex-direction:column;gap:10px}
.wiz-step > h3{margin:0;font-size:14px;display:flex;align-items:center;gap:8px}
.wiz-step > h3 em{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--ua-deep);color:#fff;display:grid;place-items:center;font-size:12px}
.wiz-step > h3 small{font-weight:400;color:var(--muted);font-size:12px}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.swatches label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-left:6px}
.swatches input[type=color]{width:40px;height:34px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;background:#fff}
.chips input:checked + span{background:var(--ua-deep);border-color:var(--ua-deep);color:#fff}
.chips input:focus-visible + span{outline:2px solid var(--ua);outline-offset:2px}
.moods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.moods label{cursor:pointer;position:relative}
.moods input{position:absolute;opacity:0;pointer-events:none}
.moods .card{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;height:100%}
.moods .aa{font-size:22px;line-height:1.2}
.moods b{font-size:13px}
.moods small{font-size:11.5px;color:var(--muted);line-height:1.4}
.moods input:checked + .card{border-color:var(--ua-deep);box-shadow:inset 0 0 0 1px var(--ua-deep);background:var(--ua-soft)}
.moods input:focus-visible + .card{outline:2px solid var(--ua);outline-offset:2px}
.wiz-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wiz-grid .full{grid-column:1/-1}
.wiz-preview{background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:20px;gap:12px;min-height:0}
.wiz-preview h4{margin:0;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.wiz-preview .pv{flex:1;min-height:0;display:grid;place-items:center}
.wiz-preview .pv > div{position:relative;box-shadow:0 10px 30px rgba(0,0,0,.15)}
.wiz-preview .pv .sheet{position:absolute;left:0;top:0;transform-origin:0 0}
.wiz-preview p{margin:0;font-size:12px;color:var(--muted)}
.wiz-actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.wiz-actions .grp{display:flex;gap:8px;flex-wrap:wrap}
.req{color:#a13d1f;font-size:11px;margin-left:4px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1c2422;color:#fff;padding:10px 18px;border-radius:10px;font-size:13.5px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}

@media (max-width:1100px){
  .work{grid-template-columns:minmax(0,1fr);overflow-y:auto}
  .side{overflow:visible}
  .side.left,.side.right{border:0;border-bottom:1px solid var(--line)}
  .stage{min-height:75vh;order:-1}
  .modal-card{grid-template-columns:1fr}
  .wiz-preview{display:none}
}
@media (max-width:600px){
  .wiz-form{padding:20px 16px}
  .moods{grid-template-columns:1fr 1fr}
  .wiz-grid{grid-template-columns:1fr}
  .top-actions{margin-left:0;width:100%}
  .top-actions .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* =========================================================
   ポスター本体（印刷物）
   単位は用紙の短辺基準(cqmin)。--k は文字量に応じた自動縮小率
   ========================================================= */
.sheet{position:relative;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--fb);container-type:size;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;--pad:6.5cqmin;font-weight:500}
.sheet *{box-sizing:border-box}
.deco{position:absolute;inset:0;z-index:0;pointer-events:none}
.deco i{position:absolute;display:block}
.inner{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:1.1em;padding:var(--pad);
  font-size:calc(var(--k) * 2.35cqmin);line-height:1.6;overflow:hidden}
.c-pop .inner{font-size:calc(var(--k) * 3.1cqmin)}
.hd{position:relative;flex:none}
.title{font-family:var(--ft);font-weight:var(--tw);font-size:2.9em;line-height:1.28;margin:0;letter-spacing:.03em;color:var(--pd);text-wrap:balance;word-break:auto-phrase}
.c-flyer .title{font-size:3.1em}
.c-pop .title{font-size:2.5em}
.sub{margin:.45em 0 0;font-size:1.25em;font-weight:700;line-height:1.5;text-wrap:balance}
.eyebrow{margin-bottom:.6em}
.eyebrow span{display:inline-block;background:var(--a);color:var(--ona);padding:.2em .9em;border-radius:calc(var(--r) * 1em);font-weight:700;font-size:1.05em;line-height:1.5}
.risk{display:inline-block;border:.12em solid var(--ink);background:var(--paper);color:var(--ink);padding:.05em .6em;font-size:.8em;font-weight:700;margin-bottom:.8em}
.bd{flex:1 0 auto;display:flex;flex-direction:column;gap:1.2em}
.col{flex:1 0 auto;display:flex;flex-direction:column;gap:1.2em;justify-content:flex-start;min-width:0}
.c-notice .col{justify-content:center}
.c-pop .col{justify-content:space-between}
.txt{display:flex;flex-direction:column;gap:1em}
.body{margin:0}
.body.comment{border:.14em dashed var(--p);border-radius:calc(var(--r) * 1em + .2em);padding:.8em 1em;background:var(--paper)}
.points{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.55em}
.points li{display:flex;gap:.6em;align-items:flex-start}
.c-notice .points{background:var(--ps);padding:1.1em 1.3em;border-radius:calc(var(--r) * 1.2em);font-size:1.12em;font-weight:700}
.mk{flex:none;width:1.25em;height:1.25em;margin-top:.18em;border-radius:50%;background:var(--p);position:relative}
.mk::after{content:"";position:absolute;left:.43em;top:.2em;width:.32em;height:.62em;border:solid var(--onp);border-width:0 .15em .15em 0;transform:rotate(45deg)}
.date{display:flex;align-items:center;gap:.8em;flex-wrap:wrap;font-size:1.3em;font-weight:700;color:var(--pd);line-height:1.4}
.date b{background:var(--p);color:var(--onp);font-size:.62em;padding:.25em .8em;border-radius:calc(var(--r) * 1em)}
.note{margin:0;font-size:.82em;opacity:.85}
.sign{margin:0;text-align:right;font-weight:700}
.photo{margin:0;flex:none;border-radius:calc(var(--r) * 1.2em);overflow:hidden;background:var(--ps)}
.photo img{display:block;width:100%;height:100%;object-fit:cover}
.port .photo{height:26cqh}
.c-pop.port .photo{height:30cqh}
.land.has-photo .bd{flex-direction:row}
.land .photo{width:38%;height:auto;min-height:20cqh}
.logo{height:1.6em;width:auto;vertical-align:middle;object-fit:contain}

/* 価格 */
.price{align-self:flex-end;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:flex-end;gap:.1em .15em;color:var(--price);font-family:var(--ft);font-weight:900;line-height:1}
.price .num{font-size:4em;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.price .yen{font-size:1.5em}
.price .tax{font-size:.9em;margin-right:.2em}
.price .pn{flex-basis:100%;text-align:right;font-size:.62em;font-weight:500;font-family:var(--fb);color:var(--ink);margin-top:.5em}

/* フッター */
.ft{flex:none}
.ft-simple{display:flex;justify-content:space-between;align-items:center;gap:.5em 1em;flex-wrap:wrap;border-top:.12em solid var(--pt);padding-top:.8em;font-size:.95em}
.ft-simple .shop-name{font-family:var(--ft);font-weight:var(--tw);font-size:1.3em;display:flex;align-items:center;gap:.4em}
.c-pop .ft-simple{justify-content:center;border:0;padding:0;font-size:.75em}
.ft-full{margin:0 calc(var(--pad) * -1) calc(var(--pad) * -1);padding:calc(var(--pad) * .7) var(--pad);background:var(--pd);color:#fff;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:.9em 2em;align-items:center;font-size:.88em}
.ft-shop{display:flex;align-items:center;gap:.6em;min-width:0}
.ft-shop .logo{height:3em;background:#fff;border-radius:.3em;padding:.2em}
.ft-full .shop-name{font-family:var(--ft);font-weight:var(--tw);font-size:1.9em;line-height:1.25}
.ft-full .tagline{font-size:.95em;opacity:.9;margin-top:.2em}
.ft-full dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.15em 1em;margin:0}
.ft-full dt{font-weight:700;opacity:.75}
.ft-full dd{margin:0}
.badges{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.4em}
.badges span{border:.1em solid currentColor;padding:.12em .75em;border-radius:calc(var(--r) * 1em + .15em);font-size:.85em}
.port.c-flyer .ft-full{grid-template-columns:minmax(0,1fr)}
.c-flyer .points{display:grid;grid-template-columns:repeat(auto-fit,minmax(13em,1fr));gap:.7em}
.c-flyer .points li{background:var(--ps);padding:.8em 1em;border-radius:calc(var(--r) * 1em);font-weight:700;line-height:1.45}

/* レイアウト案 A: 帯 / B: 額縁 / C: 色面 */
.v0 .hd,.v2 .hd{margin:calc(var(--pad) * -1) calc(var(--pad) * -1) 0;padding:var(--pad) var(--pad) calc(var(--pad) * .8)}
.v0 .hd{background:var(--p);color:var(--onp)}
.v0 .title{color:inherit}
.v0 .eyebrow span{background:var(--paper);color:var(--pd)}
.v2 .hd{background:var(--ps)}
.v1::before{content:"";position:absolute;inset:3cqmin;border:.8cqmin solid var(--p);border-radius:calc(var(--r) * 3cqmin);z-index:2;pointer-events:none}
.v1 .inner{padding:calc(var(--pad) + 3cqmin)}
.v1 .hd{text-align:center}
.v1 .ft-full{margin:0;padding:1em 0 0;background:none;color:var(--ink);border-top:.12em solid var(--pt)}
.v1 .ft-full .shop-name{color:var(--pd)}
.v1 .c-flyer .points li{background:var(--ps)}

/* 雰囲気: やさしい */
.m-gentle .d1{width:40cqmin;aspect-ratio:1;border-radius:50%;background:var(--pt);opacity:.55;right:-13cqmin;bottom:-12cqmin}
.m-gentle .d2{width:18cqmin;aspect-ratio:1;border-radius:50%;background:var(--a);opacity:.35;left:-7cqmin;bottom:22cqmin}
.m-gentle .d3{width:26cqmin;height:14cqmin;right:5cqmin;top:4cqmin;background:radial-gradient(circle,var(--pt) 22%,transparent 25%) 0 0/3.5cqmin 3.5cqmin;opacity:.8}
.m-gentle.v0 .hd::after,.m-gentle.v2 .hd::after{content:"";position:absolute;left:0;right:0;bottom:-1.9cqmin;height:2cqmin;
  background:radial-gradient(circle at 50% 0,var(--hdbg) 1.9cqmin,transparent calc(1.9cqmin + .5px)) 0 0/4cqmin 2cqmin repeat-x}
.m-gentle.v0{--hdbg:var(--p)} .m-gentle.v2{--hdbg:var(--ps)}
.m-gentle.v0 .d3{display:none}

/* 雰囲気: 清潔・信頼 */
.m-trust .d1{right:0;bottom:0;width:34cqmin;height:34cqmin;background:linear-gradient(135deg,transparent 50%,var(--ps) 50%)}
.m-trust .d2{left:0;right:0;top:0;height:1.6cqmin;background:var(--p)}
.m-trust.v1 .d2{display:none}
.m-trust .mk{border-radius:.18em}
.m-trust .c-notice .points,.m-trust.c-notice .points{border:.12em solid var(--pt)}
.m-trust .price{border:.14em solid var(--price);padding:.3em .7em;background:var(--paper)}
.m-trust .price .pn{text-align:right}

/* 雰囲気: 和・漢方 */
.m-wa .d1{left:0;right:0;bottom:0;height:13cqmin;background:var(--seigaiha) 0 0/8cqmin 4cqmin;opacity:.9}
.m-wa.v1::before{border-style:double;border-width:1.5cqmin;border-color:var(--pd)}
.m-wa .title{letter-spacing:.08em;color:var(--ink)}
.m-wa.v0 .title{color:inherit}
.m-wa .eyebrow span,.m-wa.v0 .eyebrow span{background:none;border:.12em solid currentColor;color:var(--price);border-radius:0;letter-spacing:.2em;padding:.15em .8em}
.m-wa.v0 .eyebrow span{color:var(--onp)}
.m-wa .mk{width:.6em;height:.6em;margin:.55em .3em 0;border-radius:0;transform:rotate(45deg);background:var(--a)}
.m-wa .mk::after{display:none}
.m-wa .c-flyer .points li,.m-wa.c-flyer .points li{background:var(--paper);border:.1em solid var(--pt)}
.m-wa .sub{color:var(--pd)}

/* 雰囲気: 元気・にぎやか */
.m-pop .d1{left:0;right:0;bottom:0;height:30cqmin;background:radial-gradient(circle,var(--pt) 18%,transparent 21%) 0 0/5cqmin 5cqmin;opacity:.75}
.m-pop.v0 .hd{background:repeating-linear-gradient(-45deg,var(--p) 0 3cqmin,var(--p2) 3cqmin 6cqmin)}
.m-pop.v2 .hd{background:var(--a)}
.m-pop.v2 .title{color:var(--ink)}
.m-pop.v2 .eyebrow span{background:var(--ink);color:var(--paper)}
.m-pop .eyebrow span{transform:rotate(-3deg);font-weight:900;box-shadow:.18em .18em 0 var(--ink);color:var(--ink);background:var(--a)}
.m-pop.v0 .eyebrow span{background:var(--a);color:var(--ink)}
.m-pop .mk{background:var(--a)}
.m-pop .mk::after{border-color:var(--ink)}
.m-pop .c-flyer .points li,.m-pop.c-flyer .points li{background:var(--paper);border:.14em solid var(--ink);box-shadow:.25em .25em 0 var(--p)}
.m-pop .price{width:13em;aspect-ratio:1;clip-path:var(--star);background:var(--price);color:#fff;flex-direction:column;flex-wrap:nowrap;align-items:center;justify-content:center;gap:.1em;transform:rotate(-6deg)}
.m-pop .price .num{font-size:calc(min(3.3, 15 / var(--len)) * 1em)}
.m-pop .price .tax{margin:0;font-size:.85em}
.m-pop .price .yen{font-size:1.1em}
.m-pop .price .pn{flex-basis:auto;color:#fff;text-align:center;font-size:.55em;margin-top:.2em}
.m-pop .title{letter-spacing:.01em}

/* 雰囲気: 上質・モダン */
.m-modern .d1{width:72cqmin;aspect-ratio:1;border-radius:50%;background:var(--ps);right:-32cqmin;top:20%}
.m-modern .title{color:var(--ink);letter-spacing:.06em}
.m-modern.v0 .title{color:inherit}
.m-modern .eyebrow span,.m-modern.v0 .eyebrow span{background:none;padding:0;color:var(--p);letter-spacing:.3em;font-size:.85em;display:inline-flex;align-items:center;gap:.8em}
.m-modern.v0 .eyebrow span{color:var(--onp)}
.m-modern .eyebrow span::before{content:"";width:2.4em;height:.08em;background:currentColor}
.m-modern.v1 .eyebrow span::after{content:"";width:2.4em;height:.08em;background:currentColor}
.m-modern .mk{width:1em;height:.1em;margin-top:.8em;border-radius:0}
.m-modern .mk::after{display:none}
.m-modern .c-notice .points,.m-modern.c-notice .points{background:none;border-top:.08em solid var(--ink);border-bottom:.08em solid var(--ink);border-radius:0;padding:1em 0}
.m-modern .c-flyer .points li,.m-modern.c-flyer .points li{background:none;border-top:.1em solid var(--p);border-radius:0;padding:.7em 0 0}
.m-modern .price{color:var(--ink);font-weight:700;border-top:.06em solid var(--ink);padding-top:.25em}
.m-modern .ft-full{background:var(--ink)}
.m-modern.v1 .ft-full{background:none}
.m-modern .sub{font-weight:500}

.m-gentle .price{background:var(--price);color:#fff;padding:.45em 1em .5em;border-radius:1.5em}
.m-gentle .price .pn{color:inherit}

/* 棚札（A4を4等分・8等分した帯） */
.shelf .deco{display:none}
.shelf .inner{flex-direction:row;padding:0;gap:0;font-size:calc(var(--k) * 10.5cqh);line-height:1.3}
.sl-cat{flex:none;min-width:24%;max-width:40%;display:flex;align-items:center;justify-content:center;padding:.4em .9em;background:var(--p);color:var(--onp);
  font-family:var(--ft);font-weight:var(--tw);font-size:1.25em;line-height:1.25;text-align:center;word-break:auto-phrase}
.sl-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:.15em;padding:.4em 1.1em}
.sl-name{font-family:var(--ft);font-weight:var(--tw);font-size:2.2em;line-height:1.2;color:var(--ink);word-break:auto-phrase;letter-spacing:.02em}
.sl-note{font-size:1.05em;font-weight:700;color:var(--pd)}
.shelf.v1::before{inset:6cqh 1.6cqw;border-width:2.2cqh}
.shelf.v1 .inner{flex-direction:column;justify-content:center;padding:0 5cqw}
.shelf.v1 .sl-cat{align-self:flex-start;min-width:0;max-width:none;padding:.1em .8em;font-size:.9em;border-radius:calc(var(--r) * 1em)}
.shelf.v1 .sl-main{flex:none;padding:.1em 0 0}
.shelf.v2 .inner{flex-direction:column}
.shelf.v2 .sl-cat{min-width:0;max-width:none;justify-content:flex-start;background:var(--ps);color:var(--pd);padding:.15em 1em;font-size:1.15em;border-bottom:.15em solid var(--p)}
.shelf.v2 .sl-main{padding:.1em 1.1em .2em}
.m-gentle.shelf.v0 .sl-cat{border-radius:0 2em 2em 0}
.m-trust.shelf .sl-name{font-weight:700}
.m-wa.shelf.v0 .sl-cat{background:var(--pd);color:#fff;letter-spacing:.15em}
.m-wa.shelf.v2 .sl-cat{background:var(--seigaiha) 0 0/5cqh 2.5cqh,var(--paper);color:var(--pd)}
.m-pop.shelf.v0 .sl-cat{background:repeating-linear-gradient(-45deg,var(--p) 0 3cqh,var(--p2) 3cqh 6cqh)}
.m-pop.shelf.v2 .sl-cat{background:var(--a);color:var(--ink);border-color:var(--ink)}
.m-modern.shelf.v0 .sl-cat{background:var(--ink);color:var(--paper)}
.m-modern.shelf .sl-name{font-weight:700;letter-spacing:.05em}
.shelf-page{background:#fff;display:grid;align-content:start;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.shelf-page > .sheet{outline:.25mm dashed #9aa5a1;outline-offset:-.12mm}
#sheetWrap.multi{box-shadow:none;display:flex;flex-direction:column;gap:20px;align-items:center}
.page-host{position:relative;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.08),0 16px 40px rgba(20,40,30,.16)}
.page-host > .shelf-page{position:absolute;left:0;top:0;transform-origin:0 0}
.stage-inner.scroll{overflow-y:auto;place-items:start center}

/* 棚札の入力欄 */
.shelf-tools{display:flex;gap:6px;flex-wrap:wrap}
.srows{display:flex;flex-direction:column;gap:8px}
.srow{border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px;background:#fbfcfb}
.srow.off{opacity:.55}
.srow-top{display:flex;gap:6px;align-items:center}
.srow input[type=text],.srow input[type=number]{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;min-width:0;width:100%}
.srow input[type=number]{width:52px;flex:none;font-variant-numeric:tabular-nums}
.srow input:focus{border-color:var(--ua);outline:none}
.srow .cnt{font-size:12px;color:var(--muted);white-space:nowrap}
.srow .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:12px;padding:4px;white-space:nowrap}
.srow .del:hover{color:#a13d1f}
.srow input[type=checkbox]{flex:none;width:16px;height:16px}
#shelfBulk{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;font-family:inherit;font-size:13px}

/* 印刷 */
#printArea{display:none}
@media print{
  html,body{background:#fff!important;height:auto}
  #app,.modal,.toast{display:none!important}
  #printArea{display:block}
  .print-page{overflow:hidden;display:grid;place-content:center;break-after:page;page-break-after:always}
  .print-page:last-child{break-after:auto;page-break-after:auto}
  .print-page.shelf-page{place-content:start}
  .imposed .sheet{outline:.2mm dashed #9aa5a1;outline-offset:-.1mm}
}
</style>
</head>

/* ---------------- 色のユーティリティ ---------------- */
function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}
function rgbToHsl([r,g,b]){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let h=0,s=0;const l=(mx+mn)/2;
  if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s*100,l*100]}
function hsl(h,s,l){h=((h%360)+360)%360;s=Math.max(0,Math.min(100,s))/100;l=Math.max(0,Math.min(100,l))/100;
  const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));
  return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')}
function lum(hex){return hexToRgb(hex).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0)}
function contrast(a,b){const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function onColor(bg,ink){return contrast(bg,'#ffffff')>=contrast(bg,ink)*0.82?'#ffffff':ink}

function makeTheme(color,mood){
  const [h,s,l]=rgbToHsl(hexToRgb(color));
  const sc=Math.min(s,75);
  const t={p:color};
  t.pd=hsl(h,Math.min(s,65),Math.min(Math.max(l-20,20),33));
  t.pt=hsl(h,sc*.7,84);
  t.ps=hsl(h,sc*.6,95);
  t.ink=hsl(h,18,15);
  t.paper='#ffffff';
  t.p2=hsl(h,s,Math.max(l-7,10));
  const redHue=h<18||h>335;
  t.price=redHue?t.pd:'#cf2f36';
  if(mood==='gentle'){t.a=hsl(h+35,70,74);t.paper=hsl(h,35,98.6)}
  else if(mood==='trust'){t.a=hsl(46,95,62)}
  else if(mood==='wa'){t.a=hsl(38,52,46);t.paper='#f8f4ea';t.price=redHue?t.pd:'#ad3b28';t.ink='#24201b'}
  else if(mood==='pop'){t.a=(h>30&&h<75)?hsl(h+190,70,58):hsl(48,100,58)}
  else {t.a=hsl(h,25,55);t.paper=hsl(h,12,98.6)}
  if(s<12){t.pt=hsl(h,0,84);t.ps=hsl(h,0,95)}
  t.onp=onColor(t.p,t.ink);
  t.ona=onColor(t.a,t.ink);
  return t;
}
function seigaiha(stroke,fill){
  const rings=c=>[19,14,9,4].map((r,i)=>`<circle cx='${c[0]}' cy='${c[1]}' r='${r}' fill='${i===0?fill:'none'}' stroke='${stroke}' stroke-width='1.3'/>`).join('');
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='40' height='20' viewBox='0 0 40 20'>${[[0,0],[40,0],[20,10],[0,20],[40,20]].map(rings).join('')}</svg>`;
  return 'data:image/svg+xml,'+encodeURIComponent(svg);
}
const STAR=(()=>{const n=18,p=[];for(let i=0;i<n*2;i++){const r=i%2?41:50,a=Math.PI*i/n-Math.PI/2;p.push(`${(50+r*Math.cos(a)).toFixed(2)}% ${(50+r*Math.sin(a)).toFixed(2)}%`)}return`polygon(${p.join(',')})`})();

const KEY='pharmacy-pop-studio.v1';
let state=load();
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&s.shop)return normalize(s)}}catch(e){}
  return normalize({shop:{...SAMPLE_SHOP},isSample:true});
}
function normalize(s){
  s.docs=s.docs||{};
  s.cur=Object.assign({cat:'flyer',tpl:'flyer-shop',size:'A4',orient:'portrait',variant:null,mood:null,impose:true},s.cur||{});
  if(!TPL[s.cur.tpl])s.cur.tpl='flyer-shop';
  s.shop=Object.assign({...SAMPLE_SHOP,features:[]},s.shop);
  s.shelf=Object.assign({size:'quarter',items:SHELF_SAMPLE.map(x=>({...x}))},s.shelf||{});
  if(!SHELF_SIZES[s.shelf.size])s.shelf.size='quarter';
  return s;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state));return true}
  catch(e){
    if(e&&(e.name==='QuotaExceededError'||e.code===22))toast('ブラウザに保存できませんでした。画像が大きすぎる可能性があります。');
    return false;
  }
}

function resolveMood(shop){
  if(shop.mood&&shop.mood!=='auto'&&MOODS[shop.mood])return shop.mood;
  const tally={};
  (shop.features||[]).forEach(id=>{const f=FEATURES.find(x=>x.id===id);if(f&&f.mood)tally[f.mood]=(tally[f.mood]||0)+1});
  if(tally.wa)return 'wa';
  const best=Object.entries(tally).sort((a,b)=>b[1]-a[1])[0];
  return best?best[0]:'trust';
}
function curMood(){return state.cur.mood||resolveMood(state.shop)}
function curVariant(){const m=curMood();return state.cur.variant==null?MOODS[m].variant:state.cur.variant}
function fieldsFor(tplId,shop){return Object.assign({},TPL[tplId].d(shop),(state.docs[tplId]||{}))}

const br=s=>esc(s).replace(/\n/g,'<br>');

function sheetDims(size,orient){const [w,h]=SIZES[size];return orient==='landscape'?[h,w]:[w,h]}

function applyTheme(el,shop,mood,k){
  const t=makeTheme(shop.color,mood), M=MOODS[mood], fb=M.serif?SERIF_FB:SANS_FB;
  const vars={'--p':t.p,'--p2':t.p2,'--pd':t.pd,'--pt':t.pt,'--ps':t.ps,'--a':t.a,'--ona':t.ona,'--onp':t.onp,'--ink':t.ink,'--paper':t.paper,'--price':t.price,
    '--ft':M.ft+fb,'--fb':M.fb+fb,'--tw':M.tw,'--r':M.r,'--k':k,'--star':STAR};
  if(mood==='wa')vars['--seigaiha']=`url("${seigaiha(t.pt,t.paper)}")`;
  for(const[a,b]of Object.entries(vars))el.style.setProperty(a,b);
}

function shelfPages(){
  const S=SHELF_SIZES[state.shelf.size], list=[];
  state.shelf.items.forEach(it=>{if(it.on&&(String(it.name||'').trim()||String(it.cat||'').trim())){for(let i=0;i<Math.max(1,Math.min(99,+it.n||1));i++)list.push(it)}});
  const pages=[];for(let i=0;i<list.length;i+=S.per)pages.push(list.slice(i,i+S.per));

  applyTheme(el,shop,mood,k);

  const logo=shop.logo?`<img class="logo" src="${shop.logo}" alt="">`:'';
  let hd='';
  if(f.risk)hd+=`<div class="risk">${esc(f.risk)}</div>`;
  if(f.eyebrow)hd+=`<div class="eyebrow"><span>${br(f.eyebrow)}</span></div>`;
  hd+=`<h1 class="title">${br(f.title||'')}</h1>`;
  if(f.sub)hd+=`<p class="sub">${br(f.sub)}</p>`;

  if(pts.length)txt+=`<ul class="points">${pts.map(p=>`<li><i class="mk"></i><span>${esc(p)}</span></li>`).join('')}</ul>`;

  let price='';

    price=`<div class="price">${f.tax?`<span class="tax">${esc(f.tax)}</span>`:''}<span class="num" style="--len:${len}">${esc(f.price)}</span><span class="yen">円</span>${f.priceNote?`<span class="pn">${esc(f.priceNote)}</span>`:''}</div>`;

  let ft;

    const info=[['住所',shop.address],['電話',shop.tel],['営業時間',shop.hours],['定休日',shop.holiday]].filter(x=>String(x[1]||'').trim());
    const badges=(shop.features||[]).map(id=>FEATURES.find(x=>x.id===id)).filter(Boolean);
    ft=`<footer class="ft ft-full"><div class="ft-shop">${logo}<div><div class="shop-name">${esc(shop.name)}</div>${shop.tagline&&f.title!==shop.tagline?`<div class="tagline">${esc(shop.tagline)}</div>`:''}</div></div>`+
      (info.length?`<dl>${info.map(([a,b])=>`<dt>${a}</dt><dd>${br(b)}</dd>`).join('')}</dl>`:'<div></div>')+
      (badges.length?`<div class="badges">${badges.map(b=>`<span>${esc(b.label)}</span>`).join('')}</div>`:'')+`</footer>`;
  }else{
    ft=`<footer class="ft ft-simple"><span class="shop-name">${logo}${esc(shop.name)}</span>${tpl.cat==='notice'&&shop.tel?`<span class="tel">TEL ${esc(shop.tel)}</span>`:''}</footer>`;
  }

  el.innerHTML=`<div class="deco"><i class="d1"></i><i class="d2"></i><i class="d3"></i></div>`+
    `<div class="inner"><header class="hd">${hd}</header><main class="bd">${f.image?`<figure class="photo"><img src="${f.image}" alt=""></figure>`:''}<div class="col"><div class="txt">${txt}</div>${price}</div></main>${ft}</div>`;
  return el;
}

// 文字量が多いときに用紙に収まるまで縮小する
function fit(sheet){
  const inner=sheet.querySelector('.inner');
  let k=1;sheet.style.setProperty('--k',k);
  let g=0;
  while((inner.scrollHeight>inner.clientHeight+1||inner.scrollWidth>inner.clientWidth+1)&&k>0.42&&g++<40){
    k=Math.round((k-0.03)*1000)/1000;sheet.style.setProperty('--k',k);
  }
  const over=inner.scrollHeight>inner.clientHeight+1;
  return {k,over};
}
const MM=96/25.4;
function placeScaled(sheet,host,availW,availH,maxScale=1.6){
  const pw=parseFloat(sheet.style.width)*MM, ph=parseFloat(sheet.style.height)*MM;
  const s=Math.max(.05,Math.min(availW/pw,availH/ph,maxScale));
  host.style.width=pw*s+'px';host.style.height=ph*s+'px';
  sheet.style.transform=`scale(${s})`;
  return s;
}

/* ---------------- 面付け・印刷 ---------------- */
function imposition(){
  const [w,h]=sheetDims(state.cur.size,state.cur.orient);
  const opts=[[210,297],[297,210]].map(([W,H])=>{const c=Math.floor((W+.01)/w),r=Math.floor((H+.01)/h);return{W,H,c,r,n:c*r}});
  const best=opts.sort((a,b)=>b.n-a.n)[0];
  return best.n>=2?best:null;
}
function buildPrint(){
  const c=state.cur, tpl=TPL[c.tpl];
  if(c.cat==='shelf'){
    // プレビューで文字サイズを合わせ済みのページをそのまま複製する
    const pages=[...document.querySelectorAll('#sheetWrap .shelf-page')].map(p=>{const n=p.cloneNode(true);n.style.transform='';n.style.position='static';n.classList.add('print-page');return n});
    $('#printArea').replaceChildren(...pages);
    $('#pageSize').textContent='@page{size:210mm 297mm;margin:0}';
    return pages.length;
  }
  const [w,h]=sheetDims(c.size,c.orient);
  const imp=c.impose?imposition():null;
  const page=document.createElement('div');
  page.className='print-page'+(imp?' imposed':'');
  const W=imp?imp.W:w, H=imp?imp.H:h;
  page.style.width=W+'mm';page.style.height=H+'mm';
  if(imp)page.style.gridTemplateColumns=`repeat(${imp.c},${w}mm)`;
  const n=imp?imp.n:1;
  for(let i=0;i<n;i++)page.appendChild(buildSheet({shop:state.shop,tpl,f:fieldsFor(tpl.id,state.shop),size:c.size,orient:c.orient,mood:curMood(),variant:curVariant(),k:lastFit.k}));
  $('#printArea').replaceChildren(page);
  $('#pageSize').textContent=`@page{size:${W}mm ${H}mm;margin:0}`;
}
async function doPrint(pdf){
  if(buildPrint()===0){toast('印刷する棚札がありません。商品名を入力し、チェックを入れてください');return}
  try{await document.fonts.ready}catch(e){}
  const old=document.title, tpl=TPL[state.cur.tpl];
  document.title=`${state.shop.name}_${tpl.name}_${state.cur.cat==='shelf'?SHELF_SIZES[state.shelf.size].short:SIZE_LABEL[state.cur.size]}`;
  if(pdf)toast('印刷画面の「送信先（プリンター）」で「PDFに保存」を選んでください',7000);
  setTimeout(()=>{window.print();document.title=old},pdf?300:30);
}
window.addEventListener('beforeprint',buildPrint);

/* ---------------- 画像 ---------------- */
function readImage(file,max=1400){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const s=Math.min(1,max/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      res(file.type==='image/png'||file.type==='image/svg+xml'?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',.86));
    };img.onerror=rej;img.src=r.result};
    r.onerror=rej;r.readAsDataURL(file);
  });
}

function shelfAction(act,i){
  const items=state.shelf.items;
  if(act==='add')items.push({cat:items.length?items[items.length-1].cat:'',name:'',note:'',n:1,on:true});
  else if(act==='del')items.splice(i,1);
  else if(act==='all'||act==='none')items.forEach(it=>it.on=act==='all');
  else if(act==='bulk'){
    const rows=$('#shelfBulk').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>l.split(/\t|,|，/).map(x=>x.trim()));
    if(!rows.length){toast('貼り付ける内容を入力してください');return}
    const add=rows.map(r=>r.length===1?{cat:'',name:r[0],note:''}:{cat:r[0]||'',name:r[1]||'',note:r.slice(2).join(' ')}).map(x=>({...x,n:1,on:true}));
    state.shelf.items=$('#shelfReplace').checked?add:items.concat(add);
    toast(`${add.length}件の棚札を追加しました`);
  }
  save();renderForm();renderPreview();
  if(act==='add'){const el=document.getElementById(`sr-${state.shelf.items.length-1}-name`);if(el)el.focus()}
}

  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{try{const s=JSON.parse(r.result);if(!s.shop)throw 0;state=normalize(s);state.isSample=false;save();closeWizard();renderAll();toast('設定を読み込みました')}catch(err){toast('このファイルは読み込めませんでした。書き出した設定ファイル（.json）を選んでください。')}};
  r.readAsText(file);e.target.value='';
});

/* ---------------- 起動 ---------------- */
renderAll();
if(state.isSample)openWizard();
</script>
</body>
</html>
